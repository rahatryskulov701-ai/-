<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glitch Space</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:monospace; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }

  /* --- виртуальный джойстик --- */
  #joy {
    position:fixed; left:20px; bottom:20px;
    width:130px; height:130px; border-radius:50%;
    border:2px solid rgba(0,255,200,.35);
    background:radial-gradient(circle, rgba(0,255,200,.08), rgba(0,0,0,.25));
    box-shadow:0 0 20px rgba(0,255,200,.25) inset, 0 0 15px rgba(0,255,200,.15);
    z-index:10;
  }
  #stick {
    position:absolute; left:50%; top:50%;
    width:58px; height:58px; margin:-29px 0 0 -29px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #7cffea, #00b39a 60%, #005f52);
    box-shadow:0 0 18px rgba(0,255,200,.8);
    transition:transform .05s linear;
  }
  /* --- кнопка рывка --- */
  #dash {
    position:fixed; right:24px; bottom:38px;
    width:88px; height:88px; border-radius:50%;
    border:2px solid rgba(255,60,180,.5);
    background:radial-gradient(circle, rgba(255,60,180,.18), rgba(0,0,0,.3));
    color:#ff7cd8; font-size:12px; letter-spacing:2px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px rgba(255,60,180,.35);
    z-index:10; user-select:none;
  }
  #dash:active { transform:scale(.92); box-shadow:0 0 35px rgba(255,60,180,.8); }

  #hud {
    position:fixed; top:12px; left:0; width:100%;
    text-align:center; color:#00ffc8; font-size:12px;
    letter-spacing:2px; opacity:.75; z-index:10; pointer-events:none;
    text-shadow:0 0 8px #00ffc8;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">GLITCH SPACE</div>
<div id="joy"><div id="stick"></div></div>
<div id="dash">DASH</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize(){
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ================= МИР ================= */
const world = { w: 4000, h: 4000 };

const player = {
  x: 2000, y: 2000,
  vx: 0, vy: 0,
  r: 14,
  speed: 0.55,
  maxSpeed: 5.5,
  angle: 0,
  dashCd: 0,
  trail: []
};

/* ================= ВВОД ================= */
let input = { x:0, y:0 };
const joy = document.getElementById('joy');
const stick = document.getElementById('stick');
const dashBtn = document.getElementById('dash');
let joyId = null, joyCenter = {x:0,y:0};

function joyStart(e){
  const t = e.changedTouches ? e.changedTouches[0] : e;
  const rect = joy.getBoundingClientRect();
  joyCenter.x = rect.left + rect.width/2;
  joyCenter.y = rect.top + rect.height/2;
  joyId = t.identifier !== undefined ? t.identifier : 'mouse';
  joyMove(e);
}
function joyMove(e){
  let t = null;
  if (e.changedTouches){
    for (const tt of e.changedTouches) if (tt.identifier === joyId) t = tt;
  } else t = e;
  if (!t) return;
  let dx = t.clientX - joyCenter.x;
  let dy = t.clientY - joyCenter.y;
  const max = 52;
  const len = Math.hypot(dx, dy);
  if (len > max){ dx = dx/len*max; dy = dy/len*max; }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  input.x = dx / max;
  input.y = dy / max;
}
function joyEnd(e){
  if (e.changedTouches){
    let ok = false;
    for (const tt of e.changedTouches) if (tt.identifier === joyId) ok = true;
    if (!ok) return;
  }
  joyId = null;
  input.x = 0; input.y = 0;
  stick.style.transform = 'translate(0,0)';
}

joy.addEventListener('touchstart', e => { e.preventDefault(); joyStart(e); }, {passive:false});
joy.addEventListener('touchmove',  e => { e.preventDefault(); joyMove(e); }, {passive:false});
joy.addEventListener('touchend',   e => { e.preventDefault(); joyEnd(e); }, {passive:false});
joy.addEventListener('touchcancel',e => { e.preventDefault(); joyEnd(e); }, {passive:false});

// мышь (для компа)
joy.addEventListener('mousedown', e => { e.preventDefault(); joyStart(e); });
window.addEventListener('mousemove', e => { if (joyId === 'mouse') joyMove(e); });
window.addEventListener('mouseup', e => { if (joyId === 'mouse') joyEnd(e); });

// клавиатура
const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

/* ================= DASH ================= */
function doDash(){
  if (player.dashCd > 0) return;
  player.dashCd = 1.2;
  let ax = input.x, ay = input.y;
  if (Math.hypot(ax, ay) < 0.2){
    ax = Math.cos(player.angle); ay = Math.sin(player.angle);
  }
  const l = Math.hypot(ax, ay) || 1;
  player.vx += ax/l * 18;
  player.vy += ay/l * 18;
  // глитч-вспышка
  for (let i=0;i<18;i++){
    particles.push({
      x: player.x, y: player.y,
      vx:(Math.random()-.5)*14, vy:(Math.random()-.5)*14,
      life:1, hue: 300 + Math.random()*80
    });
  }
}
dashBtn.addEventListener('touchstart', e => { e.preventDefault(); doDash(); }, {passive:false});
dashBtn.addEventListener('mousedown', e => { e.preventDefault(); doDash(); });
window.addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); doDash(); }});

/* ================= ЧАСТИЦЫ ================= */
const particles = [];
function spawnAmbient(){
  if (particles.length > 400) return;
  particles.push({
    x: player.x + (Math.random()-.5)*W*0.9,
    y: player.y + (Math.random()-.5)*H*0.9,
    vx:(Math.random()-.5)*0.4, vy:(Math.random()-.5)*0.4,
    life:1, hue: 150 + Math.random()*120, ambient:true, size: Math.random()*2+1
  });
}

/* ================= ОБНОВЛЕНИЕ ================= */
let camX = player.x, camY = player.y;
let time = 0;

function update(){
  time += 0.016;

  // клавиатура
  let kx = 0, ky = 0;
  if (keys['w']||keys['ц']||keys['arrowup'])    ky -= 1;
  if (keys['s']||keys['ы']||keys['arrowdown'])  ky += 1;
  if (keys['a']||keys['ф']||keys['arrowleft'])  kx -= 1;
  if (keys['d']||keys['в']||keys['arrowright']) kx += 1;
  if (kx||ky){ const l=Math.hypot(kx,ky); kx/=l; ky/=l; }

  const ix = input.x + kx;
  const iy = input.y + ky;

  // ускорение
  player.vx += ix * player.speed;
  player.vy += iy * player.speed;

  // трение
  player.vx *= 0.94;
  player.vy *= 0.94;

  // ограничение скорости
  const sp = Math.hypot(player.vx, player.vy);
  if (sp > player.maxSpeed){
    player.vx = player.vx/sp*player.maxSpeed;
    player.vy = player.vy/sp*player.maxSpeed;
  }

  player.x += player.vx;
  player.y += player.vy;

  // границы мира
  player.x = Math.max(player.r, Math.min(world.w - player.r, player.x));
  player.y = Math.max(player.r, Math.min(world.h - player.r, player.y));

  // угол
  if (sp > 0.5) player.angle = Math.atan2(player.vy, player.vx);

  // след
  if (sp > 1){
    player.trail.push({x:player.x, y:player.y, life:1});
  }
  for (let i=player.trail.length-1;i>=0;i--){
    player.trail[i].life -= 0.035;
    if (player.trail[i].life <= 0) player.trail.splice(i,1);
  }
  if (player.trail.length > 26) player.trail.shift();

  // кулдаун рывка
  if (player.dashCd > 0) player.dashCd -= 0.016;

  // камера
  camX += (player.x - W/2 - camX) * 0.08;
  camY += (player.y - H/2 - camY) * 0.08;

  // частицы
  spawnAmbient();
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.ambient ? 0.004 : 0.03;
    if (p.life <= 0) particles.splice(i,1);
  }
}

/* ================= РИСОВАНИЕ ================= */
function draw(){
  // фон с эффектом глитча
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.8);
  const hueShift = Math.sin(time*0.5)*20;
  g.addColorStop(0, `hsl(${260+hueShift}, 60%, 8%)`);
  g.addColorStop(1, `hsl(${200+hueShift}, 70%, 3%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(-camX, -camY);

  // сетка
  const grid = 100;
  const startX = Math.floor(camX/grid)*grid - grid;
  const startY = Math.floor(camY/grid)*grid - grid;
  ctx.lineWidth = 1;
  for (let x = startX; x < camX + W + grid; x += grid){
    const d = Math.abs((x % 400) - 200)/200;
    ctx.strokeStyle = `hsla(${170 + Math.sin(time + x*0.01)*40}, 100%, 60%, ${0.06 + d*0.06})`;
    ctx.beginPath(); ctx.moveTo(x, camY); ctx.lineTo(x, camY + H); ctx.stroke();
  }
  for (let y = startY; y < camY + H + grid; y += grid){
    const d = Math.abs((y % 400) - 200)/200;
    ctx.strokeStyle = `hsla(${170 + Math.cos(time + y*0.01)*40}, 100%, 60%, ${0.06 + d*0.06})`;
    ctx.beginPath(); ctx.moveTo(camX, y); ctx.lineTo(camX + W, y); ctx.stroke();
  }

  // частицы
  for (const p of particles){
    const a = p.life * (p.ambient ? 0.5 : 1);
    ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${a})`;
    const s = p.size || 3;
    ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
  }

  // след игрока
  for (let i=0;i<player.trail.length;i++){
    const t = player.trail[i];
    const a = t.life * 0.35;
    const r = player.r * t.life * 0.9;
    ctx.fillStyle = `hsla(${160 + i*3}, 100%, 60%, ${a})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI*2); ctx.fill();
  }

  // игрок
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  // свечение
  const glow = ctx.createRadialGradient(0,0,0, 0,0,player.r*3);
  glow.addColorStop(0, 'rgba(0,255,200,.8)');
  glow.addColorStop(1, 'rgba(0,255,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0,0,player.r*3,0,Math.PI*2); ctx.fill();

  // тело
  ctx.fillStyle = '#00ffc8';
  ctx.beginPath(); ctx.arc(0,0,player.r,0,Math.PI*2); ctx.fill();

  // глитч-сдвиг ядра
  const gx = (Math.random()-.5)*4;
  ctx.fillStyle = 'rgba(255,0,150,.7)';
  ctx.beginPath(); ctx.arc(gx,0,player.r*0.55,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,200,255,.7)';
  ctx.beginPath(); ctx.arc(-gx,0,player.r*0.5,0,Math.PI*2); ctx.fill();

  ctx.restore();
  ctx.restore();

  // глитч-полосы поверх экрана
  if (Math.random() < 0.06){
    const y = Math.random()*H;
    const h = Math.random()*20 + 4;
    ctx.fillStyle = `hsla(${Math.random()*360}, 100%, 60%, 0.12)`;
    ctx.fillRect(0, y, W, h);
  }
  if (Math.random() < 0.03){
    const off = (Math.random()-.5)*20;
    ctx.globalAlpha = 0.15;
    ctx.drawImage(c, off, 0);
    ctx.globalAlpha = 1;
  }

  // виньетка
  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3, W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // индикатор рывка
  ctx.fillStyle = player.dashCd > 0 ? 'rgba(255,60,180,.25)' : 'rgba(255,60,180,.9)';
  ctx.beginPath(); ctx.arc(W-68, H-82, 44, 0, Math.PI*2); ctx.fill();
  if (player.dashCd > 0){
    ctx.strokeStyle = '#ff3cb4';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(W-68, H-82, 44, -Math.PI/2, -Math.PI/2 + Math.PI*2*(1 - player.dashCd/1.2));
    ctx.stroke();
  }
}

/* ================= ЦИКЛ ================= */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// не даём странице скроллиться/зумиться
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
