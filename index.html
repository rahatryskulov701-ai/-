<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>GLITCH//VOID 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020206;
    font-family:monospace;
    color:white;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    image-rendering:auto;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
}

#top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;

    font-size:15px;
    font-weight:bold;

    text-shadow:
        2px 0 #ff0088,
        -2px 0 #00ffff;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 8px #00ffff;
}

#crosshair:before{
    width:22px;
    height:2px;
    top:10px;
}

#crosshair:after{
    width:2px;
    height:22px;
    left:10px;
}

#glitch{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.07) 4px
        );

    mix-blend-mode:screen;
}

#damage{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9;

    background:#ff003c;
    opacity:0;
}

#start{
    position:fixed;
    z-index:30;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:220px;
    padding:20px;

    color:white;
    background:#050509;

    border:2px solid white;

    font-family:monospace;
    font-size:21px;
    font-weight:bold;

    box-shadow:
        8px 8px #ff0088,
        -8px -8px #00ffff;
}

#start:active{
    transform:translate(-50%,-50%) scale(.95);
}

#joystick{
    position:fixed;

    left:25px;
    bottom:30px;

    width:145px;
    height:145px;

    border:2px solid rgba(0,255,255,.55);
    border-radius:50%;

    background:rgba(0,255,255,.04);

    z-index:20;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:65px;
    height:65px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(0,240,255,.25);
    border:2px solid #00ffff;

    box-shadow:
        0 0 20px #00ffff;
}

#look{
    position:fixed;
    right:0;
    top:0;

    width:55%;
    height:100%;

    z-index:15;
}

#boost{
    position:fixed;

    right:25px;
    bottom:40px;

    width:80px;
    height:80px;

    border-radius:50%;

    background:#ff008833;

    border:2px solid #ff0088;

    color:white;

    font-family:monospace;
    font-weight:bold;

    box-shadow:
        0 0 20px #ff0088;

    z-index:25;
}

#boost:active{
    transform:scale(.9);
    background:#ff0088;
}

#info{
    position:absolute;
    bottom:10px;
    left:50%;

    transform:translateX(-50%);

    font-size:10px;
    opacity:.45;
    white-space:nowrap;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="hud">

    <div id="top">
        <div id="score">SCORE 000000</div>
        <div id="hp">HP ███</div>
    </div>

    <div id="crosshair"></div>

    <div id="info">
        GLITCH//VOID — MOBILE BUILD
    </div>

</div>

<div id="glitch"></div>
<div id="damage"></div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="look"></div>

<button id="boost">BOOST</button>

<button id="start">ENTER//VOID</button>


<script>

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

}

addEventListener("resize",resize);
resize();


/* =========================
   WORLD
========================= */

const map = [

"111111111111111111111111",
"100000000000000000000001",
"101111111011111111111101",
"100000001000000000000001",
"111111101011111111111101",
"100000000010000000000001",
"101111111111111111110101",
"100000000000000000000001",
"101111111011111111111101",
"100000001000000000000001",
"101111101011111111111101",
"100000001000000000000001",
"111111111111111111111111"

];

const TILE = 64;


/* =========================
   PLAYER
========================= */

let player = {

    x:96,
    y:96,

    angle:0,

    speed:2.6,

    hp:3,

    score:0

};


/* =========================
   RAYCAST SETTINGS
========================= */

const FOV = Math.PI / 3;

let rays = Math.floor(W / 3);

function castRay(angle){

    let sin = Math.sin(angle);
    let cos = Math.cos(angle);

    let distance = 0;

    while(distance < 900){

        distance += 2;

        let x = player.x + cos * distance;
        let y = player.y + sin * distance;

        let mx = Math.floor(x / TILE);
        let my = Math.floor(y / TILE);

        if(
            my < 0 ||
            my >= map.length ||
            mx < 0 ||
            mx >= map[0].length
        ){
            return distance;
        }

        if(map[my][mx] === "1"){
            return distance;
        }

    }

    return 900;
}


/* =========================
   GLITCH CITY
========================= */

function drawBackground(){

    let grad = ctx.createLinearGradient(0,0,0,H);

    grad.addColorStop(0,"#05000c");
    grad.addColorStop(.45,"#160b24");
    grad.addColorStop(1,"#020207");

    ctx.fillStyle = grad;

    ctx.fillRect(0,0,W,H);


    /*
       НЕОНОВЫЕ ЛИНИИ В НЕБЕ
    */

    ctx.strokeStyle = "rgba(0,255,255,.12)";
    ctx.lineWidth = 1;

    for(let i=0;i<12;i++){

        let yy = H*.25 + i*18;

        ctx.beginPath();

        ctx.moveTo(0,yy);
        ctx.lineTo(W,yy);

        ctx.stroke();

    }

}


/* =========================
   WALL RENDER
========================= */

function renderWorld(){

    drawBackground();

    rays = Math.floor(W / 3);

    const strip = W / rays;

    for(let i=0;i<rays;i++){

        let cameraX = i / rays - .5;

        let angle =
            player.angle +
            cameraX * FOV;

        let distance = castRay(angle);

        /*
           FISHEYE FIX
        */

        distance *=
            Math.cos(angle-player.angle);

        let wallHeight =
            (TILE * H) / distance;

        wallHeight =
            Math.min(H*2,wallHeight);

        let top =
            H/2 - wallHeight/2;


        /*
           Цвет стены
        */

        let brightness =
            Math.max(
                20,
                170 - distance*.18
            );


        let r = brightness*.5;
        let g = brightness*.15;
        let b = brightness;


        ctx.fillStyle =
            `rgb(${r},${g},${b})`;

        ctx.fillRect(
            i*strip,
            top,
            strip+1,
            wallHeight
        );


        /*
           НЕОНОВАЯ КРОМКА
        */

        if(distance < 300){

            ctx.fillStyle =
                "rgba(0,255,255,.18)";

            ctx.fillRect(
                i*strip,
                top,
                strip+1,
                2
            );

        }


        /*
           ГЛИТЧ-РАЗРЕЗЫ
        */

        if(Math.random()<.035){

            ctx.fillStyle =
                Math.random()<.5
                ? "#ff0088"
                : "#00ffff";

            ctx.fillRect(
                i*strip,
                top + Math.random()*wallHeight,
                strip+2,
                2+Math.random()*7
            );

        }

    }

}


/* =========================
   ENEMIES
========================= */

let enemies = [

    {x:500,y:200,alive:true},
    {x:900,y:350,alive:true},
    {x:1200,y:650,alive:true},
    {x:400,y:650,alive:true}

];


function renderEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive) continue;

        let dx =
            enemy.x-player.x;

        let dy =
            enemy.y-player.y;

        let distance =
            Math.hypot(dx,dy);

        let angle =
            Math.atan2(dy,dx)-player.angle;


        while(angle > Math.PI)
            angle -= Math.PI*2;

        while(angle < -Math.PI)
            angle += Math.PI*2;


        if(
            Math.abs(angle) >
            FOV/2+.3
        ) continue;


        let size =
            (TILE*H)/distance;


        let screenX =
            W/2 +
            Math.tan(angle) *
            (W/2) /
            Math.tan(FOV/2);


        /*
           ГЛИТЧ-ВРАГ
        */

        ctx.save();

        ctx.translate(
            screenX,
            H/2
        );

        ctx.fillStyle="#ff0088";

        ctx.shadowBlur=25;
        ctx.shadowColor="#ff0088";

        ctx.fillRect(
            -size*.18,
            -size*.35,
            size*.36,
            size*.7
        );

        ctx.shadowBlur=0;

        ctx.fillStyle="white";

        ctx.fillRect(
            -size*.12,
            -size*.12,
            size*.08,
            size*.08
        );

        ctx.fillRect(
            size*.04,
            -size*.12,
            size*.08,
            size*.08
        );

        /*
           RGB СМЕЩЕНИЕ
        */

        ctx.globalAlpha=.45;

        ctx.fillStyle="#00ffff";

        ctx.fillRect(
            -size*.18+5,
            -size*.35,
            size*.36,
            size*.7
        );

        ctx.restore();

    }

}


/* =========================
   MOVEMENT
========================= */

let joystickX=0;
let joystickY=0;

let boosting=false;


function move(){

    let speed =
        player.speed *
        (boosting ? 2.4 : 1);


    let forward = -joystickY;
    let side = joystickX;


    let dx =
        Math.cos(player.angle)*forward -
        Math.sin(player.angle)*side;

    let dy =
        Math.sin(player.angle)*forward +
        Math.cos(player.angle)*side;


    let nx =
        player.x + dx*speed;

    let ny =
        player.y + dy*speed;


    if(!isWall(nx,player.y))
        player.x=nx;

    if(!isWall(player.x,ny))
        player.y=ny;

}


function isWall(x,y){

    let mx =
        Math.floor(x/TILE);

    let my =
        Math.floor(y/TILE);


    if(
        my<0 ||
        my>=map.length ||
        mx<0 ||
        mx>=map[0].length
    )
        return true;


    return map[my][mx]==="1";

}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(){

    for(const enemy of enemies){

        if(!enemy.alive)
            continue;


        let dx =
            player.x-enemy.x;

        let dy =
            player.y-enemy.y;

        let d =
            Math.hypot(dx,dy);


        if(d < 260){

            let speed=.7;

            let nx =
                enemy.x+
                dx/d*speed;

            let ny =
                enemy.y+
                dy/d*speed;


            if(!isWall(nx,enemy.y))
                enemy.x=nx;

            if(!isWall(enemy.x,ny))
                enemy.y=ny;

        }


        if(d<30){

            enemy.alive=false;

            player.hp--;

            player.score =
                Math.max(
                    0,
                    player.score-100
                );

            hitEffect();

            updateHUD();


            if(player.hp<=0){

                gameOver();

            }

        }

    }

}


/* =========================
   EFFECTS
========================= */

function hitEffect(){

    const d =
        document.getElementById("damage");

    d.style.opacity=.7;

    setTimeout(()=>{
        d.style.opacity=0;
    },100);

}


function glitch(){

    if(Math.random()<.04){

        ctx.save();

        let y =
            Math.random()*H;

        let h =
            2+Math.random()*15;

        let offset =
            (Math.random()-.5)*50;

        ctx.drawImage(
            canvas,
            0,y,W,h,
            offset,y,W,h
        );

        ctx.restore();

    }

}


/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById("score")
        .textContent =
        "SCORE "+
        String(Math.floor(player.score))
        .padStart(6,"0");


    document.getElementById("hp")
        .textContent =
        "HP "+
        "█".repeat(Math.max(0,player.hp))+
        "░".repeat(3-player.hp);

}


/* =========================
   GAME LOOP
========================= */

let running=false;

function loop(){

    if(!running)
        return;


    move();

    updateEnemies();


    player.score += .08;


    renderWorld();

    renderEnemies();

    glitch();

    updateHUD();


    requestAnimationFrame(loop);

}


/* =========================
   START
========================= */

document.getElementById("start")
.onclick=()=>{

    running=true;

    document.getElementById("start")
        .style.display="none";

    requestAnimationFrame(loop);

};


/* =========================
   MOBILE JOYSTICK
========================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joyActive=false;


function joystickMove(e){

    const rect =
        joystick.getBoundingClientRect();

    let cx =
        rect.left+
        rect.width/2;

    let cy =
        rect.top+
        rect.height/2;


    let dx =
        e.clientX-cx;

    let dy =
        e.clientY-cy;


    let max=48;

    let d =
        Math.hypot(dx,dy);


    if(d>max){

        dx =
            dx/d*max;

        dy =
            dy/d*max;

    }


    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;


    joystickX =
        dx/max;

    joystickY =
        dy/max;

}


joystick.addEventListener(
    "pointerdown",
    e=>{

        joyActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);

    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(joyActive)
            joystickMove(e);

    }
);


joystick.addEventListener(
    "pointerup",
    ()=>{

        joyActive=false;

        joystickX=0;
        joystickY=0;

        stick.style.left="50%";
        stick.style.top="50%";

    }
);


/* =========================
   LOOK
========================= */

const look =
    document.getElementById("look");

let lookActive=false;
let lastLookX=0;


look.addEventListener(
    "pointerdown",
    e=>{

        lookActive=true;

        lastLookX=e.clientX;

        look.setPointerCapture(
            e.pointerId
        );

    }
);


look.addEventListener(
    "pointermove",
    e=>{

        if(!lookActive)
            return;


        let dx =
            e.clientX-lastLookX;


        player.angle +=
            dx*.006;


        lastLookX=e.clientX;

    }
);


look.addEventListener(
    "pointerup",
    ()=>{

        lookActive=false;

    }
);


/* =========================
   BOOST
========================= */

const boost =
    document.getElementById("boost");


boost.addEventListener(
    "pointerdown",
    ()=>{
        boosting=true;
    }
);


boost.addEventListener(
    "pointerup",
    ()=>{
        boosting=false;
    }
);


boost.addEventListener(
    "pointercancel",
    ()=>{
        boosting=false;
    }
);


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    const button =
        document.getElementById("start");

    button.textContent =
        "REBOOT//VOID";

    button.style.display="block";

    document.getElementById("score")
        .textContent =
        "SYSTEM FAILURE";

}


/* =========================
   INITIAL
========================= */

updateHUD();

</script>

</body>
</html>
