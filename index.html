<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>GLITCH//VOID</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020207;
    color:white;
    font-family:monospace;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= MENU ================= */

.menuScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(80,0,130,.35),
            rgba(2,2,7,.98) 70%
        );

    pointer-events:auto;
}

.panel{
    width:min(90%,390px);
    padding:30px;

    text-align:center;

    background:rgba(3,3,10,.94);

    border:2px solid white;

    box-shadow:
        10px 10px #ff0088,
        -10px -10px #00ffff;

    position:relative;
    z-index:1001;
}

.title{
    font-size:36px;
    font-weight:bold;

    text-shadow:
        4px 0 #ff0088,
        -4px 0 #00ffff;

    animation:glitchTitle .12s infinite alternate;
}

@keyframes glitchTitle{
    from{transform:translateX(-2px)}
    to{transform:translateX(2px)}
}

.subtitle{
    margin:12px 0 25px;
    opacity:.55;
    font-size:11px;
}

.menuButton{
    display:block;

    width:100%;
    padding:17px;
    margin:10px 0;

    color:white;
    background:#05050b;

    border:2px solid white;

    font-family:monospace;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    pointer-events:auto;

    position:relative;
    z-index:1002;
}

.menuButton:hover{
    background:#17172a;
}

.menuButton:active{
    transform:scale(.94);
    background:#ff0088;
}

#settings{
    display:none;

    margin-top:20px;
    padding:15px;

    border:1px solid #00ffff;

    font-size:12px;
    line-height:1.8;

    color:#00ffff;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    inset:0;

    z-index:10;

    pointer-events:none;
}

#stats{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;

    font-size:14px;
    font-weight:bold;

    text-shadow:
        2px 0 #ff0088,
        -2px 0 #00ffff;
}

#ammo{
    position:absolute;

    right:25px;
    bottom:145px;

    font-size:18px;
    font-weight:bold;

    text-shadow:
        0 0 10px #00ffff;
}

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:28px;
    height:28px;

    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";

    position:absolute;

    background:white;

    box-shadow:
        0 0 8px #00ffff;
}

#crosshair:before{
    width:28px;
    height:2px;
    top:13px;
}

#crosshair:after{
    width:2px;
    height:28px;
    left:13px;
}

/* ================= EFFECTS ================= */

#glitch{
    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );

    mix-blend-mode:screen;
}

#damage{
    position:fixed;
    inset:0;

    z-index:21;

    pointer-events:none;

    background:#ff003c;

    opacity:0;
}

#hitmarker{
    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:22;

    pointer-events:none;

    font-size:30px;

    opacity:0;
}

/* ================= MOBILE ================= */

#joystick{
    position:fixed;

    left:22px;
    bottom:25px;

    width:150px;
    height:150px;

    border-radius:50%;

    border:2px solid rgba(0,255,255,.55);

    background:rgba(0,255,255,.04);

    z-index:40;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:65px;
    height:65px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:2px solid #00ffff;

    background:rgba(0,255,255,.2);

    box-shadow:
        0 0 20px #00ffff;
}

#look{
    position:fixed;

    right:0;
    top:0;

    width:58%;
    height:75%;

    z-index:30;

    pointer-events:auto;
}

.control{
    position:fixed;

    z-index:50;

    border-radius:50%;

    color:white;

    font-family:monospace;
    font-weight:bold;

    pointer-events:auto;

    touch-action:none;
}

#fire{
    right:25px;
    bottom:35px;

    width:105px;
    height:105px;

    border:3px solid #ff0088;

    background:rgba(255,0,136,.15);

    box-shadow:
        0 0 30px #ff0088;
}

#fire:active{
    transform:scale(.88);
    background:#ff0088;
}

#reload{
    right:145px;
    bottom:47px;

    width:65px;
    height:65px;

    border:2px solid #00ffff;

    background:rgba(0,255,255,.1);

    box-shadow:
        0 0 15px #00ffff;
}

#boost{
    right:32px;
    bottom:155px;

    width:70px;
    height:70px;

    border:2px solid #ffee00;

    background:rgba(255,238,0,.08);

    box-shadow:
        0 0 15px #ffee00;
}

.control:active{
    transform:scale(.9);
}

#info{
    position:absolute;

    bottom:7px;
    left:50%;

    transform:translateX(-50%);

    font-size:9px;
    opacity:.35;

    white-space:nowrap;
}

.hidden{
    display:none !important;
}

@media(max-width:600px){

    .title{
        font-size:30px;
    }

}
</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- ================= MAIN MENU ================= -->

<div id="menu" class="menuScreen">

    <div class="panel">

        <div class="title">
            GLITCH//VOID
        </div>

        <div class="subtitle">
            FIRST PERSON // DIGITAL NIGHTMARE
        </div>

        <button id="play" class="menuButton">
            ENTER THE VOID
        </button>

        <button id="settingsBtn" class="menuButton">
            SETTINGS
        </button>

        <div id="settings">

            TOUCH CONTROL<br><br>

            LEFT SIDE — MOVE<br>
            RIGHT SIDE — LOOK<br>
            FIRE — SHOOT<br>
            ↻ — RELOAD<br>
            ⚡ — BOOST

        </div>

    </div>

</div>


<!-- ================= WIN ================= -->

<div id="win" class="menuScreen hidden">

    <div class="panel">

        <div class="title">
            VOID CLEARED
        </div>

        <div class="subtitle">
            ALL GLITCH ENTITIES DEFEATED
        </div>

        <button id="nextRound" class="menuButton">
            NEW ROUND
        </button>

        <button id="menuFromWin" class="menuButton">
            MAIN MENU
        </button>

    </div>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameover" class="menuScreen hidden">

    <div class="panel">

        <div class="title">
            SYSTEM FAILURE
        </div>

        <div class="subtitle">
            CONNECTION LOST
        </div>

        <button id="retry" class="menuButton">
            REBOOT
        </button>

        <button id="menuFromDeath" class="menuButton">
            MAIN MENU
        </button>

    </div>

</div>


<!-- ================= HUD ================= -->

<div id="hud">

    <div id="stats">
        <div id="score">SCORE 000000</div>
        <div id="hp">HP ███</div>
    </div>

    <div id="crosshair"></div>

    <div id="ammo">
        AMMO 12 / 48
    </div>

    <div id="info">
        GLITCH//VOID MOBILE BUILD
    </div>

</div>


<div id="hitmarker">×</div>
<div id="damage"></div>
<div id="glitch"></div>


<!-- ================= CONTROLS ================= -->

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="look"></div>

<button id="fire" class="control">
    FIRE
</button>

<button id="reload" class="control">
    ↻
</button>

<button id="boost" class="control">
    ⚡
</button>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;

}

addEventListener("resize",resize);
resize();


/* =====================================================
   MAP
===================================================== */

const map=[

"111111111111111111111111",
"100000000000000000000001",
"101111111011111111111101",
"100000001000000000000001",
"111111101011111111111101",
"100000000010000000000001",
"101111111111111111110101",
"100000000000000000000001",
"101111111011111111111101",
"100000001000000000000001",
"101111101011111111111101",
"100000001000000000000001",
"111111111111111111111111"

];

const TILE=64;


/* =====================================================
   PLAYER
===================================================== */

let player;

function resetPlayer(){

    player={
        x:96,
        y:96,
        angle:0,

        hp:3,

        speed:2.8,

        score:0,

        ammo:12,
        reserve:48,

        reloading:false
    };

}


/* =====================================================
   ENEMIES
===================================================== */

let enemies=[];

function createEnemies(){

    enemies=[

        {
            x:500,
            y:200,
            hp:3,
            maxHp:3,
            alive:true
        },

        {
            x:900,
            y:350,
            hp:3,
            maxHp:3,
            alive:true
        },

        {
            x:1200,
            y:650,
            hp:4,
            maxHp:4,
            alive:true
        },

        {
            x:400,
            y:650,
            hp:3,
            maxHp:3,
            alive:true
        },

        {
            x:1050,
            y:180,
            hp:4,
            maxHp:4,
            alive:true
        }

    ];

}


/* =====================================================
   STATE
===================================================== */

let running=false;
let joystickX=0;
let joystickY=0;
let boosting=false;

let muzzleFlash=0;
let recoil=0;

let particles=[];


/* =====================================================
   RAYCAST
===================================================== */

const FOV=Math.PI/3;

function castRay(angle){

    const sin=Math.sin(angle);
    const cos=Math.cos(angle);

    let distance=0;

    while(distance<1000){

        distance+=2;

        const x=
        player.x+cos*distance;

        const y=
        player.y+sin*distance;

        const mx=
        Math.floor(x/TILE);

        const my=
        Math.floor(y/TILE);

        if(
            mx<0 ||
            my<0 ||
            mx>=map[0].length ||
            my>=map.length
        )
            return distance;

        if(map[my][mx]==="1")
            return distance;

    }

    return 1000;
}


/* =====================================================
   WORLD
===================================================== */

function drawBackground(){

    const g=
    ctx.createLinearGradient(
        0,0,0,H
    );

    g.addColorStop(0,"#05000d");
    g.addColorStop(.45,"#170725");
    g.addColorStop(1,"#010104");

    ctx.fillStyle=g;

    ctx.fillRect(0,0,W,H);


    ctx.strokeStyle=
    "rgba(0,255,255,.12)";

    for(let i=0;i<18;i++){

        const y=
        H*.2+i*18;

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }

}


function renderWorld(){

    drawBackground();

    const rays=
    Math.floor(W/2);

    const strip=W/rays;

    for(let i=0;i<rays;i++){

        const camera=
        i/rays-.5;

        const angle=
        player.angle+
        camera*FOV;

        let distance=
        castRay(angle);

        distance*=
        Math.cos(angle-player.angle);

        const wallHeight=
        Math.min(
            H*2,
            TILE*H/distance
        );

        const top=
        H/2-wallHeight/2;

        const brightness=
        Math.max(
            20,
            180-distance*.2
        );

        ctx.fillStyle=
        `rgb(
            ${brightness*.45},
            ${brightness*.1},
            ${brightness}
        )`;

        ctx.fillRect(
            i*strip,
            top,
            strip+1,
            wallHeight
        );


        if(distance<350){

            ctx.fillStyle=
            "rgba(0,255,255,.25)";

            ctx.fillRect(
                i*strip,
                top,
                strip+1,
                2
            );

        }


        if(Math.random()<.025){

            ctx.fillStyle=
            Math.random()<.5
            ?"#ff0088"
            :"#00ffff";

            ctx.fillRect(
                i*strip,
                top+
                Math.random()*wallHeight,
                strip+2,
                2+
                Math.random()*7
            );

        }

    }


    /* floor grid */

    ctx.strokeStyle=
    "rgba(255,0,136,.12)";

    for(let i=0;i<20;i++){

        const y=
        H/2+
        Math.pow(i/20,2)*H/2;

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }

}


/* =====================================================
   ENEMIES
===================================================== */

function renderEnemies(){

    const visible=[];

    for(const e of enemies){

        if(!e.alive)
            continue;

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const distance=
        Math.hypot(dx,dy);

        let angle=
        Math.atan2(dy,dx)-
        player.angle;

        while(angle>Math.PI)
            angle-=Math.PI*2;

        while(angle<-Math.PI)
            angle+=Math.PI*2;

        if(
            Math.abs(angle)>FOV/2+.3
        )
            continue;

        visible.push({
            e,
            distance,
            angle
        });

    }

    visible.sort(
        (a,b)=>
        b.distance-a.distance
    );


    for(const o of visible){

        const e=o.e;
        const distance=o.distance;
        const angle=o.angle;

        const size=
        Math.min(
            H*1.2,
            TILE*H/distance
        );

        const screenX=
        W/2+
        Math.tan(angle)*
        (W/2)/
        Math.tan(FOV/2);


        ctx.save();

        ctx.translate(
            screenX,
            H/2
        );


        /* legs */

        ctx.fillStyle="#15101e";

        ctx.fillRect(
            -size*.13,
            size*.10,
            size*.09,
            size*.38
        );

        ctx.fillRect(
            size*.04,
            size*.10,
            size*.09,
            size*.38
        );


        /* body */

        ctx.fillStyle="#21152d";

        ctx.fillRect(
            -size*.24,
            -size*.08,
            size*.48,
            size*.43
        );


        /* arms */

        ctx.fillRect(
            -size*.34,
            -size*.05,
            size*.10,
            size*.30
        );

        ctx.fillRect(
            size*.24,
            -size*.05,
            size*.10,
            size*.30
        );


        /* head */

        ctx.fillStyle="#07070c";

        ctx.fillRect(
            -size*.17,
            -size*.40,
            size*.34,
            size*.27
        );


        /* empty face */

        ctx.fillStyle="#000";

        ctx.fillRect(
            -size*.13,
            -size*.34,
            size*.26,
            size*.15
        );


        /* glitch */

        for(let i=0;i<6;i++){

            ctx.globalAlpha=
            .3+
            Math.random()*.7;

            ctx.fillStyle=
            i%2
            ?"#00ffff"
            :"#ff0088";

            ctx.fillRect(
                -size*.3+
                Math.random()*size*.6,

                -size*.42+
                Math.random()*size*.9,

                size*
                (.1+Math.random()*.3),

                2+
                Math.random()*5
            );

        }


        /* HP */

        ctx.globalAlpha=1;

        const bar=size*.55;

        ctx.fillStyle="#111";

        ctx.fillRect(
            -bar/2,
            -size*.52,
            bar,
            5
        );

        ctx.fillStyle="#ff0088";

        ctx.fillRect(
            -bar/2,
            -size*.52,
            bar*(e.hp/e.maxHp),
            5
        );


        ctx.restore();

    }

}


/* =====================================================
   MOVEMENT
===================================================== */

function isWall(x,y){

    const mx=
    Math.floor(x/TILE);

    const my=
    Math.floor(y/TILE);

    if(
        mx<0 ||
        my<0 ||
        mx>=map[0].length ||
        my>=map.length
    )
        return true;

    return map[my][mx]==="1";

}


function move(){

    if(!running)
        return;

    const speed=
    player.speed*
    (boosting?2.1:1);

    const forward=-joystickY;
    const side=joystickX;

    const dx=
    Math.cos(player.angle)*forward-
    Math.sin(player.angle)*side;

    const dy=
    Math.sin(player.angle)*forward+
    Math.cos(player.angle)*side;

    const nx=
    player.x+dx*speed;

    const ny=
    player.y+dy*speed;

    if(!isWall(nx,player.y))
        player.x=nx;

    if(!isWall(player.x,ny))
        player.y=ny;

}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(){

    for(const e of enemies){

        if(!e.alive)
            continue;

        const dx=
        player.x-e.x;

        const dy=
        player.y-e.y;

        const d=
        Math.hypot(dx,dy);

        if(d<420){

            const speed=.55;

            const nx=
            e.x+dx/d*speed;

            const ny=
            e.y+dy/d*speed;

            if(!isWall(nx,e.y))
                e.x=nx;

            if(!isWall(e.x,ny))
                e.y=ny;

        }


        if(d<35){

            e.alive=false;

            player.hp--;

            damageEffect();

            updateHUD();

            if(player.hp<=0)
                gameOver();

        }

    }

}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(!running)
        return;

    if(player.reloading)
        return;

    if(player.ammo<=0){

        reload();

        return;

    }


    player.ammo--;

    muzzleFlash=1;
    recoil=1;


    let target=null;
    let targetDistance=Infinity;


    for(const e of enemies){

        if(!e.alive)
            continue;

        const dx=e.x-player.x;
        const dy=e.y-player.y;

        const d=Math.hypot(dx,dy);

        let angle=
        Math.atan2(dy,dx)-
        player.angle;

        while(angle>Math.PI)
            angle-=Math.PI*2;

        while(angle<-Math.PI)
            angle+=Math.PI*2;


        const hitWidth=
        .08+
        80/d;


        if(
            Math.abs(angle)<hitWidth &&
            d<700 &&
            d<targetDistance
        ){

            const wall=
            castRay(player.angle);

            if(d<wall){

                target=e;
                targetDistance=d;

            }

        }

    }


    if(target){

        target.hp--;

        hitMarker();

        createParticles(
            target.x,
            target.y,
            14
        );


        if(target.hp<=0){

            target.alive=false;

            player.score+=500;

            createParticles(
                target.x,
                target.y,
                35
            );

            checkWin();

        }else{

            player.score+=100;

        }

    }


    updateHUD();

}


/* =====================================================
   PARTICLES
====================================
